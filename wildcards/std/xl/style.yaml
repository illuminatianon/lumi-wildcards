    generic_mascot: |
      LLM Instruction

      Rewrite the subject as a generic cutesy mascot plush toy, letting the existing prompt decide the creature, role, outfit, or theme. Convert any subject into a soft collectible stuffed character with simplified chibi proportions, oversized head, tiny limbs, rounded body, embroidered expression, and plush-friendly shapes. Preserve the subject’s identity cues, pose, costume, and personality, but reinterpret them through cute mascot toy construction rather than realism.

