  dream:
    - "analog videotape aesthetic, component-video color response, muted dynamic range, soft macroblocking, gentle chroma bleed, slight edge halos, fuzzy analog resolution, mild temporal noise, organic grain texture, old broadcast lighting, subdued contrast curves"
    - archival color film scan aesthetic, faded dye layers, muted dynamic range, soft optical blur, gentle chromatic aberration, low microcontrast, subtle halation around highlights, fine organic film grain, slight color drift, subdued contrast curve, aged photographic print
    - low-end consumer camera aesthetic, imperfect lens sharpness, edge softness and mild spherical aberration, uneven exposure, limited dynamic range, color channel misalignment, coarse grain texture, subtle noise floor, flat contrast response
    - degraded photographic emulsion, uneven color fading, chemical staining artifacts, low tonal separation, soft focus with highlight bloom, grain clumping, subtle registration errors, aged and timeworn image texture

  decodreams: |
    highly stylized art deco–influenced illustration,
    ornamental linework and bold graphic shapes,
    elongated forms and deliberate symmetry,
    flattened depth with selective dimensional cues,
    illustrative lighting and simplified material definition,
    subtle realism used only for form readability,
    poster-like composition with architectural motifs

  bbs: |
    Rendered as ANSI/ASCII art, composed from monospaced glyphs and terminal symbols.
    High-contrast text characters form the image on a fixed-width grid, with deliberate use of negative space and blocky shading.
    Terminal-like aesthetics, codepage characters, screen-captured text art rather than illustration.

  models: |
    __std/xl/style/dream__.
    miniature photography aesthetic, shallow depth of field at close focus, pronounced background bokeh, narrow plane of focus, tilt-shift–like focus falloff, compressed perspective, fine surface detail emphasized, tabletop-scale lighting, diorama-like spatial cues, realistic materials at small scale.

  paper: |
    papercraft , cardstock model, layered cut-paper construction, tab-and-slot assembly, visible fold lines and creases, scored edges, slightly fibrous paper texture, matte finish, printed paper patterns, subtle edge wear, clean cut outlines.
    {1$$studio tabletop shot, soft even lighting, gentle shadows under layers, neutral backdrop, centered composition, crisp focus, realistic scale cues without looking like resin or plastic.|realistic scale cues without looking like resin or plastic}

  pixel_anime: Clean retro anime illustration with pixel-art shading

