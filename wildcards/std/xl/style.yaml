    v3: |
      LLM Instruction

      Rewrite the subject as a small handmade plush mascot toy, designed like a cute collectible stuffed animal rather than a real creature or person. The character should have simplified chibi proportions, oversized head, tiny limbs, soft stuffed volume, stitched construction, embroidered facial features, fabric accessories, and slightly uneven handmade details. The design should feel like something sold in a cute toy shop or arcade prize line.

