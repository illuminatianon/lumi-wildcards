      LLM Instruction

      Rewrite the scene so that only the female character is a handmade plush doll, while the surrounding environment remains physically real. The character should clearly read as a soft sewn figure: stuffed fabric body, simplified feminine silhouette, rounded proportions, embroidered facial features, yarn or fabric hair, stitched clothing details, visible seams, and slight handmade asymmetry. Preserve the character’s pose, role, and interaction with the scene, but reinterpret her anatomy and surface construction as plush textile material.

      Style Block

      female plush doll subject, soft fleece skin, felt facial features, embroidered eyes and mouth, yarn hair, stitched outfit panels, visible seams, stuffed limbs, rounded hands, compressed toy proportions, subtle fabric wrinkles, handmade imperfections, real-world environment, natural lighting, tactile contrast between plush subject and realistic surroundings
    v1: |
      LLM Instruction

      Rewrite the scene as a handmade plush diorama, where every subject, object, and environmental feature is constructed from sewn fabric, stuffing, felt patches, embroidery, and visible seams. Replace realistic anatomy and hard surfaces with soft rounded forms, compressed proportions, fabric folds, and stitched detailing. Any deformation, asymmetry, sagging, or uneven stitching is intentional and should read as handcrafted plush construction rather than error.

      Style Block

      soft fleece, felt, corduroy, cotton fabric panels, exposed seams, embroidered outlines, button-like details, quilted background elements, stuffed volume, rounded silhouettes, visible thread, gentle fabric wrinkles, toy-scale construction, photographed as a tactile handmade object
