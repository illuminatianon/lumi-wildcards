  bluebeam:
    all:
      - __std/xl/style/bluebeam/v1__
    v1: |
      LLM Instruction — Rewrite Rule

      Rewrite the scene as a staged alien-invasion apocalypse produced by a collapsing global hologram system, where the “aliens” are not physical beings but gigantic projected figures made from fractured light, satellite interference, atmospheric distortion, and malfunctioning propaganda imagery. The world should feel caught between real disaster and artificial spectacle: buildings, crowds, clouds, and aircraft interact with the projections as if reality itself is being overwritten. Imperfections, projection glitches, scale errors, duplicated silhouettes, and unstable lighting are intentional.

      Style Block

      night sky split by blue-white projection beams, colossal translucent alien forms above ruined city towers, satellite grids visible through storm clouds, emergency lights, smoke columns, crowds in silhouette, broken screens broadcasting identical symbols, holographic scanlines, lens flare from artificial sky projectors, distorted perspective, cinematic disaster composition, cold electric blue and ash gray palette
