aliens:
  all:
    - |
      Rewrite the scene as an alien creation-and-deployment ritual where the image first selects one coherent creator species from __std/xl/aliens/species/all__ and one matching technology system from __std/xl/aliens/technology/all__. The hybrid woman is their attempt at a perfect Earth-compatible human, but she carries disguised inheritance from the selected species through __std/xl/aliens/hybrid_traits/all__. The chamber, tools, lighting, restraints, deployment apparatus, and mission ritual must all obey the same alien logic. The alien creators must be physically present, interacting with her through species-consistent tools, rituals, body language, and sensory systems. The mission is Earth insertion for a covert hybridization program, expressed through __std/xl/aliens/program_methods/all__. Keep the scene clinical, covert, ceremonial, uncanny, and internally consistent. Avoid explicit sexual imagery.

    - |
      Rewrite the scene as a species-consistent alien hybridization tableau. First instantiate one alien civilization from __std/xl/aliens/species/all__; then reinterpret the woman, chamber, technology, lighting, and mission procedure as products of that civilization. She is not a normal human model: she is a hybrid emissary engineered to pass on Earth while quietly revealing __std/xl/aliens/hybrid_traits/all__. The setting uses __std/xl/aliens/technology/all__, with alien handlers physically present and performing __std/xl/aliens/program_methods/all__. The result should feel like a non-human civilization translating itself into a human disguise.

    - |
      Rewrite the scene as a covert deployment ceremony inside an alien vessel. A hybrid woman has been created by __std/xl/aliens/species/all__ using __std/xl/aliens/technology/all__. Her apparent human perfection is species-biased, revealing __std/xl/aliens/hybrid_traits/all__. The chamber should not look like generic sci-fi; it must follow one coherent alien ontology. The aliens are preparing her for Earth insertion through __std/xl/aliens/program_methods/all__, with clinical ritual staging, restrained horror, and no explicit erotic framing.

